# docker-compose.yml 定义 PulseFeed 本地全栈编排：MySQL/Redis/RabbitMQ + API/Worker + Web，
# 并提供可选的 monitoring profile（Prometheus/Grafana 配置属于 S21，profile 默认不启动）。
name: pulsefeed

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: pulsefeed-root
      MYSQL_DATABASE: PulseFeed
      MYSQL_USER: pulsefeed
      MYSQL_PASSWORD: pulsefeed
    ports:
      - "3307:3306"
    volumes:
      - pulsefeed-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: pulsefeed
      RABBITMQ_DEFAULT_PASS: pulsefeed
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      # ping 只证明 Erlang 节点存活；check_port_connectivity 额外确认 AMQP 监听端口可连接，
      # 避免 Worker 在 5672 尚未就绪时启动并因 connection refused 退出。
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    command: ["/app/pulsefeed-api", "-config", "/app/configs/config.docker.yaml"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8090:8090"
    volumes:
      - pulsefeed-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker:
    build:
      context: ./api
      dockerfile: Dockerfile
    command: ["/app/pulsefeed-worker", "-config", "/app/configs/config.docker.yaml", "-metrics-addr", ":9092"]
    # 第二道保险：即使 MQ 初始化仍偶发失败，容器也会自动重启而不是停在 Exited。
    restart: unless-stopped
    depends_on:
      # Worker 也执行 AutoMigrate；等待 API 迁移完成后再启动，避免并发建表触发 1050。
      api:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    # 宿主机固定 19092：Win11 Hyper-V 动态保留段会占用 9092 一类的端口，不能依赖默认值。
    ports:
      - "19092:9092"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9092/metrics"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8088:80"

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.55.1
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_healthy
    ports:
      # 宿主机固定 19090：9090 落在 Win11 Hyper-V 保留段 9020–9119，与 S20 的 Worker 19092 同源处理。
      - "19090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.3.0
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: pulsefeed
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      # dashboard JSON 由 file provider 自动加载（目录已在 provisioning/dashboards 中声明）。
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - pulsefeed-grafana-data:/var/lib/grafana

volumes:
  pulsefeed-mysql-data:
  pulsefeed-uploads:
  pulsefeed-grafana-data:
