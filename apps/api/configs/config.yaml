port: 8090

# 可信反向代理：只有来自这些地址的 X-Forwarded-For / X-Real-IP 才会被用于解析客户端 IP；
# 为空表示直连部署，仅使用 TCP 对端地址。登录/刷新限流依赖真实 IP，不要放行任意来源。
trusted_proxies:
  - 127.0.0.1
  - ::1

jwt:
  secret: pulsefeed-local-dev-secret-4f8c2b7e9a1d
  access_ttl: 30m
  refresh_ttl: 336h
  refresh_grace: 30s
  leeway: 30s

internal:
  # 本地开发令牌；生产通过 PULSEFEED_INTERNAL_TOKEN 注入，至少 32 字节且不能是占位值。
  token: pulsefeed-local-internal-token-8f3c2a7d

feed:
  # 翻页游标签名密钥；生产通过 PULSEFEED_FEED_CURSOR_SECRET 注入，至少 32 字节且不能是占位值。
  cursor_secret: pulsefeed-local-cursor-secret-2d7a4c9e5b1f

database:
  host: 127.0.0.1
  port: 3306
  user: root
  password: "123456"
  name: PulseFeed

redis:
  addr: 127.0.0.1:6379
  password: ""
  db: 0

rabbitmq:
  url: amqp://guest:guest@127.0.0.1:5672/
  clip_exchange: pulsefeed.clip
  clip_published_queue: pulsefeed.clip.published
  clip_published_routing: clip.published
  clip_embedding_queue: pulsefeed.clip.embedding
  interaction_exchange: pulsefeed.interaction
  action_changed_queue: pulsefeed.interaction.action_changed
  action_changed_routing: interaction.action_changed
  impression_exchange: pulsefeed.impression
  play_event_recorded_queue: pulsefeed.impression.play_recorded
  play_event_recorded_routing: impression.play_recorded
