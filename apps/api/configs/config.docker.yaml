# Docker Compose 专用配置：服务名即主机名（mysql/redis/rabbitmq），账号与 compose 环境变量保持一致。
port: 8090

# 可信反向代理：compose 内 nginx 容器反代 /api，容器地址落在默认 bridge 网段。
# 仅信任该网段，公网来源伪造的 X-Forwarded-For 不会被采信。
trusted_proxies:
  - 172.16.0.0/12

jwt:
  secret: pulsefeed-compose-dev-secret-9c3a8b1d2e6f
  access_ttl: 30m
  refresh_ttl: 336h
  refresh_grace: 30s
  leeway: 30s

internal:
  # 容器开发令牌；生产通过 PULSEFEED_INTERNAL_TOKEN 注入，至少 32 字节且不能是占位值。
  token: pulsefeed-compose-internal-token-6b9e4d1a

database:
  host: mysql
  port: 3306
  user: pulsefeed
  password: pulsefeed
  name: PulseFeed

redis:
  addr: redis:6379
  password: ""
  db: 0

rabbitmq:
  url: amqp://pulsefeed:pulsefeed@rabbitmq:5672/
  clip_exchange: pulsefeed.clip
  clip_published_queue: pulsefeed.clip.published
  clip_published_routing: clip.published
  clip_embedding_queue: pulsefeed.clip.embedding
  interaction_exchange: pulsefeed.interaction
  action_changed_queue: pulsefeed.interaction.action_changed
  action_changed_routing: interaction.action_changed
  impression_exchange: pulsefeed.impression
  play_event_recorded_queue: pulsefeed.impression.play_recorded
  play_event_recorded_routing: impression.play_recorded
