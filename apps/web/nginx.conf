# nginx.conf 托管前端静态产物，并把 /api 与 /uploads 反向代理到 compose 内的 api 服务。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # 后端上传上限为视频 512MB（图片 20MB）；预留 8MB multipart 余量，
        # 避免 nginx 先于后端拒绝合法的大视频请求。
        client_max_body_size 520m;
        # 大文件上传与后端 ffprobe 校验可能超过默认 60s，放宽读写超时。
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        proxy_pass http://api:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://api:8090;
        proxy_set_header Host $host;
    }

    # 前端为单页应用，未知路径回落到 index.html。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
