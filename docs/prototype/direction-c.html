<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PulseFeed · 方向 C 草图（视频优先全屏流）</title>
<style>
  :root {
    --void: #000;
    --text-1: #fff;
    --text-2: rgba(255,255,255,0.72);
    --a-500: #7c5cff;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--void); color: var(--text-1); font-family: var(--sans); overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .stage-wrap { height: 100%; display: grid; place-items: center; padding: 20px; }

  .stage {
    position: relative; width: 420px; height: 820px; max-height: calc(100vh - 40px);
    border-radius: 32px; overflow: hidden; background: #06070b;
    box-shadow: 0 30px 90px rgba(0,0,0,0.75), 0 0 0 1px rgba(255,255,255,0.08);
  }
  .scene {
    position: absolute; inset: 0;
    background: var(--art);
  }
  .scene::after {
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(90% 45% at 50% 100%, rgba(0,0,0,0.72), transparent 70%),
      radial-gradient(70% 40% at 50% 0%, rgba(0,0,0,0.5), transparent 65%);
  }
  .glyph {
    position: absolute; left: 28px; top: 26%; z-index: 1;
    font-size: 82px; font-weight: 700; color: rgba(255,255,255,0.9);
    letter-spacing: 0.1em; text-shadow: 0 8px 48px rgba(0,0,0,0.4);
  }
  .topbar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 5;
    padding: 16px 16px 0; display: flex; gap: 12px; align-items: center;
  }
  .segments { display: flex; gap: 4px; flex: 1; }
  .segments i { flex: 1; height: 2px; border-radius: 2px; background: rgba(255,255,255,0.24); display: block; }
  .segments i.on { background: #fff; }
  .topbar .who { margin-left: auto; font-size: 12px; color: var(--text-2); }

  .rail { position: absolute; right: 12px; bottom: 150px; z-index: 6; display: flex; flex-direction: column; gap: 22px; }
  .rail button { display: flex; flex-direction: column; align-items: center; gap: 5px; color: #fff; }
  .rail .ring {
    width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center;
    background: rgba(255,255,255,0.12); backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.16);
  }
  .rail button[aria-pressed="true"] .ring { background: var(--a-500); border-color: transparent; }
  .rail small { font-size: 11px; font-variant-numeric: tabular-nums; color: var(--text-1); }
  .rail .avatar-lg {
    width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center;
    background: linear-gradient(140deg,#7c5cff,#2b1a63); font-size: 16px; font-weight: 600;
    border: 2px solid rgba(255,255,255,0.7);
  }

  .info { position: absolute; left: 18px; right: 92px; bottom: 72px; z-index: 6; }
  .creator-line { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  .creator-line .dot { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,0.5); }
  .creator-line span.handle { font-weight: 400; color: var(--text-2); font-size: 12px; }
  .info h1 { font-size: 17px; line-height: 1.45; margin: 0 0 10px; font-weight: 600; }
  .info p { margin: 0; font-size: 12px; color: var(--text-2); line-height: 1.6; }
  .tags { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .tags span { font-size: 11px; padding: 3px 9px; border-radius: 999px; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.12); }
  .hint {
    position: absolute; left: 0; right: 0; bottom: 10px; z-index: 6;
    text-align: center; font-size: 11px; color: rgba(255,255,255,0.45); letter-spacing: 0.1em;
  }
  .swipe {
    position: absolute; left: 50%; bottom: 34px; transform: translateX(-50%);
    width: 22px; height: 22px; opacity: 0.6; animation: float 1.8s ease-in-out infinite;
  }
  @keyframes float { 0%,100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, -7px); } }

  .caption {
    position: fixed; left: 28px; top: 26px; z-index: 10;
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.5);
  }
  .caption b { display: block; font-size: 14px; letter-spacing: 0; text-transform: none; color: #fff; margin-bottom: 4px; }

  @media (max-width: 720px) {
    .stage-wrap { padding: 0; }
    .stage { width: 100%; height: 100%; max-height: none; border-radius: 0; box-shadow: none; }
    .caption { display: none; }
    .info { right: 82px; bottom: 66px; }
  }
  @media (prefers-reduced-motion: reduce) { .swipe { animation: none; } }
</style>
</head>
<body>
<div class="caption"><b>方向 C</b>视频优先全屏流 · Feed 首页草图</div>
<div class="stage-wrap">
  <div class="stage">
    <div class="scene" style="--art: linear-gradient(160deg,#0a0b16 0%,#241457 34%,#7c5cff 58%,#22d3ee 82%,#9af0ff 100%)"></div>
    <span class="glyph" aria-hidden="true">舞</span>

    <div class="topbar">
      <div class="segments" aria-hidden="true"><i class="on"></i><i></i><i></i><i></i></div>
      <span class="who">推荐 · 2/8</span>
    </div>

    <div class="rail">
      <button aria-label="作者主页"><span class="avatar-lg">K</span></button>
      <button aria-pressed="true" aria-label="点赞">
        <span class="ring"><svg width="21" height="21" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21s-7-4.6-9.3-8.1A5 5 0 0 1 12 6a5 5 0 0 1 9.3 6.9C18.3 16.4 12 21 12 21z"/></svg></span>
        <small>8,420</small>
      </button>
      <button aria-label="评论">
        <span class="ring"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M21 12a8 8 0 0 1-8 8H7l-4 3V12a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8z"/></svg></span>
        <small>326</small>
      </button>
      <button aria-label="收藏">
        <span class="ring"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 4h12v17l-6-4-6 4z"/></svg></span>
        <small>1,205</small>
      </button>
      <button aria-label="分享">
        <span class="ring"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v14"/></svg></span>
      </button>
    </div>

    <div class="info">
      <div class="creator-line">阿 K<span class="dot"></span><span class="handle">@kstreet</span></div>
      <h1>凌晨的巷子里，一段 8 拍的即兴</h1>
      <p>灯光只开了一盏，跳到第三遍才踩准鼓点。#街舞 #夜景 #一条过</p>
      <div class="tags"><span>街舞</span><span>夜景</span><span>城市</span></div>
    </div>

    <div class="hint">上滑继续</div>
    <div class="swipe" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
    </div>
  </div>
</div>
</body>
</html>
